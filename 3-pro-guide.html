<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI 프로 제대로 쓰기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 탭(Claude/Gemini)으로 같은 구조의 가이드 두 개를 전환. 각 가이드는 준비 → 기능 카드 → 습관 → 주의 순서 */
:root{
  --bg:#f2f6f8; --surface:#ffffff; --fg:#13212c; --muted:#556675; --line:#d6e0e6;
  --accent:#d9631e; --accent-soft:#fbe6d6; --accent-fg:#ffffff;
  --claude:#d9631e; --claude-soft:#fbe6d6;
  --gemini:#2b66d9; --gemini-soft:#dde8fb; --gpt:#0b8a68; --gpt-soft:#d8f1e7;
  --warn:#b4372b; --warn-soft:#fbe3df;
  --font-display:'Do Hyeon','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171e; --surface:#16232d; --fg:#e8eff3; --muted:#9fb0bc; --line:#26384a;
  --accent:#f09a62; --accent-soft:#3d2a1c; --accent-fg:#1b1008;
  --claude:#f09a62; --claude-soft:#3d2a1c; --gemini:#7aa7ff; --gemini-soft:#1b2b4a; --gpt:#4fd1a5; --gpt-soft:#123d30;
  --warn:#f08a7e; --warn-soft:#3f2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171e; --surface:#16232d; --fg:#e8eff3; --muted:#9fb0bc; --line:#26384a;
  --accent:#f09a62; --accent-soft:#3d2a1c; --accent-fg:#1b1008;
  --claude:#f09a62; --claude-soft:#3d2a1c; --gemini:#7aa7ff; --gemini-soft:#1b2b4a; --gpt:#4fd1a5; --gpt-soft:#123d30;
  --warn:#f08a7e; --warn-soft:#3f2420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.75 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:clamp(32px,6vw,52px)}
h2{font-size:clamp(25px,4vw,32px);margin-bottom:6px}
h3{font-size:20px}
p{margin:0 0 10px}
section{margin-top:56px}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
header{padding-block:44px 0}
header p{color:var(--muted);font-size:18px;max-width:52ch;margin-top:12px}

/* 탭 */
.tabs{display:flex;gap:8px;margin-top:28px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:17px;padding:10px 22px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent-fg);border-color:var(--accent);background:var(--accent)}
.tab:focus-visible,.copy:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.guide[data-who="claude"]{--accent:var(--claude);--accent-soft:var(--claude-soft)}
.guide[data-who="gemini"]{--accent:var(--gemini);--accent-soft:var(--gemini-soft)}
.guide[data-who="gpt"]{--accent:var(--gpt);--accent-soft:var(--gpt-soft)}
:root[data-who="gpt"]{--accent:var(--gpt)}
:root[data-who="gemini"] .tab[aria-selected="true"]{background:var(--gemini);border-color:var(--gemini)}
:root[data-who="gemini"]{--accent:var(--gemini)}
:root[data-who="claude"]{--accent:var(--claude)}

/* 시작 3단계 */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.step .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;margin-bottom:8px}
@media(max-width:760px){.steps{grid-template-columns:1fr}}

/* 기능 카드 */
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:8px}
.feat .top{display:flex;gap:12px;align-items:center}
.ico{width:48px;height:48px;flex:none;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center}
.ico svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feat p{color:var(--muted);margin:0;font-size:15px}
.ex{margin-top:auto;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;position:relative}
.ex small{display:block;font-weight:700;color:var(--accent);margin-bottom:2px;font-size:12px;letter-spacing:.06em}
.copy{margin-top:8px;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:2px 12px;cursor:pointer}
@media(max-width:700px){.feats{grid-template-columns:1fr}}

/* 습관/주의 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.box.warn{background:var(--warn-soft);border-color:transparent}
.box.warn h3{color:var(--warn)}
.box ul{margin:10px 0 0;padding-left:20px}
.box li{margin-bottom:6px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}

/* 흐름 그림 */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px;overflow-x:auto}
.flow svg{display:block;width:100%;min-width:560px;height:auto}
footer{margin-top:48px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">유료 결제했다면 여기부터</div>
  <h1>AI 프로 버전, 제대로 쓰기</h1>
  <p>결제만 하고 무료처럼 쓰면 돈이 아깝습니다. 프로에서 열리는 기능과 바로 따라 할 수 있는 요청 문장을 정리했습니다.</p>
  <div class="tabs" role="tablist" aria-label="서비스 선택">
    <button class="tab" role="tab" id="tab-claude" data-who="claude" aria-selected="true">Claude 프로</button>
    <button class="tab" role="tab" id="tab-gemini" data-who="gemini" aria-selected="false">Gemini AI 프로</button>
    <button class="tab" role="tab" id="tab-gpt" data-who="gpt" aria-selected="false">ChatGPT 플러스</button>
  </div>
</header>

<main id="out"></main>

<footer>
  기능 이름과 한도, 화면 위치는 수시로 바뀝니다. 메뉴가 다르면 도움말 검색창에 기능 이름을 넣어 찾으세요. 예시 문장은 복사해서 내 상황에 맞게 고쳐 쓰세요. AI가 만든 숫자, 인용, 성경 구절 위치는 반드시 직접 확인하세요.
</footer>
</div>

    ['구글 계정 확인','결제한 계정과 평소 쓰는 구글 계정이 같은지 확인합니다. 다르면 기능이 열리지 않을 수 있습니다.'],
    ['Gem(나만의 도우미) 만들기','자주 하는 일마다 지침을 넣은 도우미를 만듭니다. 예: 주보 문구 도우미, 소식지 편집자'],
    ['구글 앱 연결 켜기','Gmail, 드라이브, 캘린더를 연결하면 "내 메일에서 찾아 줘" 같은 요청이 됩니다.']
  ],
  feats:[
    ['gem','Gem','역할과 지침을 저장한 나만의 도우미입니다. 매번 같은 설명을 쓰지 않아도 됩니다.','너는 교회 주보 편집자야. 내가 일정을 주면 두 줄 이내의 따뜻한 안내 문구로 바꿔 줘.'],
    ['search','Deep Research','웹을 폭넓게 찾아 계획을 세우고 긴 보고서로 정리합니다. 구글 문서로 내보내기도 쉽습니다.','(주제)에 대해 최근 자료를 조사해서 목차가 있는 보고서로 만들어 줘. 출처 링크 포함.'],
    ['mail','Gmail·문서·드라이브 안에서','메일 답장 초안, 문서 다듬기, 드라이브 파일 요약을 각 앱 안에서 바로 합니다.','이 메일에 정중하게 일정 변경을 요청하는 답장을 써 줘. 세 문장 이내.'],
    ['book','NotebookLM 연동','올린 자료만 근거로 요약하고 질문에 답하는 학습 도구입니다. 프로에서는 한도가 늘어납니다.','올린 PDF 세 개를 근거로, 공통점과 차이점을 표로 정리해 줘.'],
    ['image','이미지 만들기','설명만으로 그림을 만들고, 올린 사진을 고치거나 스타일을 바꿀 수 있습니다.','밝은 수채화 느낌의 가을 야외 예배 포스터 배경을 만들어 줘. 글자는 넣지 말고.'],
    ['video','영상 만들기','짧은 영상을 만들 수 있습니다. 횟수 제한이 있고 길이가 짧아 보조 영상용으로 적당합니다.','잔잔한 호수에 해가 뜨는 8초 영상을 만들어 줘. 카메라는 천천히 앞으로.']

  habits:['사진이나 파일을 올리고 "이 자료만 근거로 답해 줘"라고 범위를 정합니다.','자주 쓰는 요청은 Gem으로 저장해서 재사용합니다.','Deep Research는 계획을 먼저 보여 주므로, 실행 전에 방향을 고쳐 줍니다.','이미지는 "누구를, 어디서, 어떤 분위기로"를 구체적으로 적을수록 좋습니다.'],

}};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(who){
  var d=DATA[who], h='';
  h+='<div class="guide" data-who="'+who+'">';
  h+='<section><div class="eyebrow">'+({claude:'CLAUDE PRO',gemini:'GEMINI AI PRO',gpt:'CHATGPT PLUS'})[who]+'</div><h2>'+d.title+'</h2><p class="lead">'+d.lead+'</p></section>';
  h+='<section><h2>먼저 세 가지만 설정하세요</h2><div class="steps">';
  d.steps.forEach(function(s,i){h+='<div class="step"><span class="n">'+(i+1)+'</span><h3>'+s[0]+'</h3><p style="margin-top:6px;color:var(--muted);font-size:15px">'+s[1]+'</p></div>'});
  h+='</div></section>';
  h+='<section><h2>꼭 써 볼 기능 여섯 가지</h2><p class="lead">각 카드의 예시 문장을 복사해서 그대로 붙여 넣어 보세요.</p><div class="feats">';
  d.feats.forEach(function(f,i){
    h+='<div class="feat"><div class="top">'+ico(f[0])+'<h3>'+f[1]+'</h3></div><p>'+f[2]+'</p>'
     +'<div class="ex"><small>이렇게 시켜 보세요</small><span id="ex-'+who+i+'">'+esc(f[3])+'</span><br><button class="copy" data-t="ex-'+who+i+'">복사</button></div></div>';
  });
  h+='</div></section>';
  // flow
  var n=d.flow.length,w=140,svg='<svg viewBox="0 0 '+(n*w+20)+' 90" role="img" aria-label="작업 흐름: '+d.flow.join(', ')+'">';
  d.flow.forEach(function(t,i){
    var x=10+i*w;
    svg+='<rect x="'+x+'" y="18" width="116" height="52" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>'
      +'<text x="'+(x+58)+'" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)" font-family="Noto Sans KR, sans-serif">'+t+'</text>';
    if(i<n-1)svg+='<path d="M'+(x+120)+' 44h14m-5-5l5 5-5 5" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  svg+='</svg>';
  h+='<section><h2>일하는 흐름</h2><div class="flow">'+svg+'</div></section>';
  h+='<section><div class="cols"><div class="box"><h3>이렇게 하면 결과가 좋아집니다</h3><ul>'+d.habits.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'
    +'<div class="box warn"><h3>조심할 점</h3><ul>'+d.warns.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div></div></section>';
  h+='</div>';
  document.getElementById('out').innerHTML=h;
}
function pick(who){
  document.documentElement.setAttribute('data-who',who);
  ['claude','gemini','gpt'].forEach(function(k){document.getElementById('tab-'+k).setAttribute('aria-selected',k===who?'true':'false')});
  render(who);
  try{history.replaceState(null,'','#'+who)}catch(e){}
}
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){pick(b.dataset.who)})});
document.getElementById('out').addEventListener('click',function(e){
  var b=e.target.closest('.copy'); if(!b)return;
  var el=document.getElementById(b.dataset.t), txt=el.textContent;
  function done(){b.textContent='복사됨';setTimeout(function(){b.textContent='복사'},1500)}
  function fallback(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됨 (Ctrl+C)'}
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}
});
function fromHash(){return location.hash==='#gemini'?'gemini':(location.hash==='#gpt'?'gpt':'claude')}
window.addEventListener('hashchange',function(){pick(fromHash())});
pick(fromHash());
</script>
